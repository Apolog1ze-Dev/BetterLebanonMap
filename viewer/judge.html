<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Queue</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dddad3; --accent: #1a73e8;
          --A: #1e90ff; --B: #ff8c00; --C: #ba55d3; --D: #2ecc71; --house: #d93025; }
  :root[data-theme="dark"], :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17181b; --panel: #222327; --ink: #ececf0; --muted: #a0a0a8; --line: #34353a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 16px; }
  header .stats { color: var(--muted); }
  header a { color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 1fr 320px; min-height: 0; }
  .map { position: relative; min-height: 0; }
  .map > div { position: absolute; inset: 0; }
  .map .label { position: absolute; z-index: 500; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65);
                color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 12px; pointer-events: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; overflow: auto; }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .proposal { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .chip { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-weight: 700; margin-right: 6px; }
  ol.cands { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px; }
  ol.cands button { width: 100%; text-align: left; display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 8px;
                    border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  ol.cands button.proposed { border-color: var(--ink); }
  ol.cands .names { display: grid; }
  ol.cands .ar { direction: rtl; text-align: left; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .actions button { padding: 9px 6px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .empty { padding: 30px 10px; text-align: center; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 38vh 38vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Access queue</h1>
  <span class="stats" id="stats">Loading…</span>
  <span class="muted">The model's least confident answers, least confident first. <a href="./">Back to the map</a></span>
</header>
<main>
  <div class="map"><div id="sat"></div><span class="label">Satellite (Esri)</span></div>
  <div class="map"><div id="osm"></div><span class="label">OpenStreetMap</span></div>
  <aside id="side"><p class="muted">Loading…</p></aside>
</main>
<script src="js/judge.js"></script>
</body>
</html>
