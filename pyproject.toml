[project]
name = "better-lebanon-map"
version = "0.1.0"
description = "Derive systematic street names and French-style metric house numbers for Lebanon from OpenStreetMap"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Karim Dagher" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "networkx>=3.4",
    "numpy>=2.5.4",
    "osmium>=4.3.2",
    "pandas>=3.1.0",
    "pillow>=11",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/better_lebanon_map"]
